<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 9: Dr. Lindsay Dubock • The Boundaries Ladder Briefing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#0C2340',
                        deepnavy: '#061426',
                        trust: '#005EB8',
                        orange: '#FE5000',
                        slate: '#333F48',
                        ice: '#DBE2E9',
                        cream: '#F8FAFC'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        *, *:before, *:after {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            background: transparent;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        ::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }

        /* Sentence highlighting tokens */
        .sentence-token {
            display: block;
            margin-bottom: 10px;
            padding: 12px 16px;
            border-radius: 12px;
            border-left: 4px solid transparent;
            transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
            line-height: 1.6;
            font-size: 15px;
        }
        @media (min-width: 640px) {
            .sentence-token {
                font-size: 16px;
                padding: 14px 18px;
            }
        }
        .sentence-active {
            background-color: #FE5000;
            color: #ffffff !important;
            font-weight: 600;
            border-left-color: #0C2340;
            box-shadow: 0 6px 18px rgba(254, 80, 0, 0.32);
            transform: translateX(3px);
        }
        .sentence-spoken {
            color: #0C2340;
            opacity: 0.95;
            font-weight: 500;
            border-left-color: #DBE2E9;
            background-color: rgba(219, 226, 233, 0.35);
        }
        .sentence-upcoming {
            color: #94A3B8;
            opacity: 0.65;
            font-weight: 400;
            border-left-color: transparent;
            background-color: transparent;
        }
    </style>
</head>
<body class="bg-transparent text-slate font-sans p-1 sm:p-3 md:p-5 flex flex-col items-center justify-center w-full min-h-screen">

    <div class="w-full max-w-6xl mx-auto bg-white border border-ice rounded-2xl md:rounded-3xl shadow-md overflow-hidden flex flex-col md:flex-row items-stretch min-h-[460px] md:min-h-[520px]">
        
        <!-- Left Side: Interactive Telemetry & Sentence-by-Sentence Viewport -->
        <div class="flex-1 p-5 sm:p-7 md:p-9 flex flex-col justify-between space-y-4 md:space-y-6 order-2 md:order-1">
            
            <!-- Header Metadata -->
            <div>
                <div class="flex items-center justify-between gap-2 pb-3 border-b border-ice/80">
                    <div class="flex items-center space-x-2.5">
                        <span class="w-3 h-3 rounded-full bg-orange animate-pulse"></span>
                        <span class="text-xs sm:text-sm font-bold uppercase tracking-wider text-trust">
                            Phase 3 · Abstract Conceptualisation & Safety
                        </span>
                    </div>
                    <div id="delayNotice" class="text-xs sm:text-sm font-mono text-orange font-semibold bg-orange/10 px-3 py-1 rounded-lg">
                        Starting in 2s...
                    </div>
                </div>

                <div class="mt-3.5">
                    <h2 class="text-xl sm:text-2xl md:text-3xl font-bold text-navy tracking-tight leading-tight">
                        The Boundaries Ladder: Clinical Briefing
                    </h2>
                    <p class="text-xs sm:text-sm md:text-base text-slate/75 mt-1.5 leading-normal">
                        Where empathy ends and professional safety limits begin
                    </p>
                </div>
            </div>

            <!-- Sentence Highlighting Viewport -->
            <div id="transcriptViewport" class="p-4 sm:p-5 md:p-6 bg-slate-50 border border-ice/90 rounded-2xl overflow-y-auto flex-1 min-h-[260px] md:min-h-[340px] leading-relaxed scroll-smooth shadow-inner">
                <div id="speechBox">
                    <!-- Sentences populated via JavaScript -->
                </div>
            </div>

        </div>

        <!-- Right Side: Dr. Lindsay Portrait & Identity Badge -->
        <div class="w-full md:w-80 lg:w-96 xl:w-[420px] bg-navy relative shrink-0 min-h-[300px] md:min-h-full flex items-center justify-center overflow-hidden order-1 md:order-2 border-b md:border-b-0 md:border-l border-ice">
            <img src="./Unfolded_arms_on_background_202609081318.jpeg" 
                 onerror="this.onerror=null; this.src='./facing_camera.jpeg';"
                 alt="Dr. Lindsay Dubock" 
                 class="w-full h-full object-cover object-[24%_12%]">
            
            <div class="absolute inset-0 bg-gradient-to-t from-navy/95 via-navy/20 to-transparent pointer-events-none"></div>

            <!-- Portrait Bottom Identity Badge -->
            <div class="absolute bottom-4 left-4 right-16 sm:bottom-5 sm:left-5 sm:right-20 text-white pointer-events-none">
                <div class="text-sm sm:text-base md:text-lg font-bold tracking-tight">Dr. Lindsay Dubock</div>
                <div class="text-xs sm:text-sm text-ice/85 mt-0.5">Director, The Training Network</div>
            </div>

            <!-- Small Play/Pause Button on Picture (Bottom Right) -->
            <button id="btnPlayPause" onclick="toggleAudio()" 
                    class="absolute bottom-4 right-4 sm:bottom-5 sm:right-5 w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-orange hover:bg-white text-white hover:text-navy flex items-center justify-center transition-all active:scale-95 shadow-lg border border-white/20 cursor-pointer z-10"
                    title="Play / Pause Briefing">
                <svg id="playPauseIcon" class="w-5 h-5 ml-0.5 fill-current" viewBox="0 0 24 24">
                    <path d="M8 5v14l11-7z"/>
                </svg>
            </button>

            <!-- Live Broadcast Audio Indicator Pill -->
            <div class="absolute top-4 right-4 sm:top-5 sm:right-5 bg-navy/85 backdrop-blur-xs text-white text-xs font-bold uppercase tracking-wider px-3.5 py-1.5 rounded-full border border-white/20 flex items-center space-x-2 shadow-sm">
                <span id="speakerPulse" class="w-2.5 h-2.5 rounded-full bg-orange animate-pulse"></span>
                <span id="speakerStatus">Ready</span>
            </div>
        </div>

    </div>

    <script>
        // Verbatim spoken text and timings for Block 2: Audio Briefing (Slide 9)
        const timedPhrases = [
            { 
                id: 0, 
                start: 0.0, 
                end: 7.8, 
                text: "When we teach you to look beneath the waterline, staff often worry: 'Are you asking me to just sit here and take verbal abuse because the patient is distressed?'" 
            },
            { 
                id: 1, 
                start: 7.9, 
                end: 11.2, 
                text: "Let me be completely clear: no." 
            },
            { 
                id: 2, 
                start: 11.3, 
                end: 16.5, 
                text: "Understanding the driver does not excuse the behaviour. Empathy is a diagnostic tool, not a surrender." 
            },
            { 
                id: 3, 
                start: 16.6, 
                end: 25.5, 
                text: "The Boundaries Ladder is your safety framework. It gives you four clear, proportional rungs to hold your professional limits calmly, firmly, and consistently without provoking an argument." 
            },
            { 
                id: 4, 
                start: 25.6, 
                end: 35.0, 
                text: "Step onto each rung as escalation demands — from re-anchoring the tone, to naming the operational barrier, to offering clear choice, and exiting safely." 
            }
        ];

        // Populate sentence blocks into the container
        const speechBox = document.getElementById('speechBox');
        timedPhrases.forEach((phrase) => {
            const p = document.createElement('div');
            p.id = `s-${phrase.id}`;
            p.className = "sentence-token sentence-upcoming";
            p.innerText = phrase.text;
            speechBox.appendChild(p);
        });

        const audio = new Audio('./HD_S09_Lindsay_BoundariesLadderIntro.wav');
        let isPlaying = false;
        let ticker = null;
        let totalDuration = 35.0;

        audio.addEventListener('loadedmetadata', () => {
            if (audio.duration && !isNaN(audio.duration)) {
                totalDuration = audio.duration;
            }
        });

        audio.addEventListener('ended', () => {
            pauseAudio();
            resetTranscript();
            document.getElementById('speakerStatus').innerText = "Completed";
            document.getElementById('speakerPulse').classList.remove('animate-ping');
        });

        function playAudio() {
            isPlaying = true;
            document.getElementById('delayNotice').classList.add('hidden');
            document.getElementById('playPauseIcon').innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
            document.getElementById('playPauseIcon').classList.remove('ml-0.5');
            document.getElementById('speakerStatus').innerText = "Speaking";
            document.getElementById('speakerPulse').classList.add('animate-ping');

            audio.play().catch(err => {
                console.warn("Direct audio blocked or missing, falling back to speech synthesis:", err);
                fallbackSpeechSynthesis();
            });

            clearInterval(ticker);
            ticker = setInterval(updateLiveProgress, 40);
        }

        function pauseAudio() {
            isPlaying = false;
            document.getElementById('playPauseIcon').innerHTML = '<path d="M8 5v14l11-7z"/>';
            document.getElementById('playPauseIcon').classList.add('ml-0.5');
            document.getElementById('speakerStatus').innerText = "Paused";
            document.getElementById('speakerPulse').classList.remove('animate-ping');
            audio.pause();
            if ('speechSynthesis' in window) window.speechSynthesis.pause();
            clearInterval(ticker);
        }

        function toggleAudio() {
            if (isPlaying) {
                pauseAudio();
            } else {
                playAudio();
            }
        }

        function updateLiveProgress() {
            const current = audio.currentTime;

            let activeSentenceEl = null;

            timedPhrases.forEach((phrase) => {
                const el = document.getElementById(`s-${phrase.id}`);
                if (current >= phrase.start && current < phrase.end) {
                    el.className = "sentence-token sentence-active";
                    activeSentenceEl = el;
                } else if (current >= phrase.end) {
                    el.className = "sentence-token sentence-spoken";
                } else {
                    el.className = "sentence-token sentence-upcoming";
                }
            });

            // Smooth auto-scroll following the active sentence
            if (activeSentenceEl) {
                const container = document.getElementById('transcriptViewport');
                const offsetTop = activeSentenceEl.offsetTop - container.offsetTop;
                if (Math.abs(container.scrollTop - (offsetTop - 20)) > 25) {
                    container.scrollTo({ top: offsetTop - 20, behavior: 'smooth' });
                }
            }
        }

        function resetTranscript() {
            timedPhrases.forEach((phrase) => {
                const el = document.getElementById(`s-${phrase.id}`);
                if (el) el.className = "sentence-token sentence-upcoming";
            });
            document.getElementById('transcriptViewport').scrollTo({ top: 0, behavior: 'smooth' });
        }

        function fallbackSpeechSynthesis() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const fullText = timedPhrases.map(p => p.text).join(' ');
                const utterance = new SpeechSynthesisUtterance(fullText);
                utterance.rate = 0.92;
                utterance.pitch = 0.95;
                const voices = window.speechSynthesis.getVoices();
                const ukVoice = voices.find(v => v.lang.includes('en-GB') || v.name.includes('British') || v.name.includes('UK'));
                if (ukVoice) utterance.voice = ukVoice;

                utterance.onboundary = function(e) {
                    const charRatio = e.charIndex / Math.max(1, fullText.length);
                    const approxTime = charRatio * totalDuration;
                    timedPhrases.forEach((phrase) => {
                        const el = document.getElementById(`s-${phrase.id}`);
                        if (approxTime >= phrase.start && approxTime < phrase.end) {
                            el.className = "sentence-token sentence-active";
                        } else if (approxTime >= phrase.end) {
                            el.className = "sentence-token sentence-spoken";
                        } else {
                            el.className = "sentence-token sentence-upcoming";
                        }
                    });
                };

                utterance.onend = () => {
                    pauseAudio();
                    resetTranscript();
                };

                window.speechSynthesis.speak(utterance);
            }
        }

        // Automatic 2-Second Delay Countdown
        window.addEventListener('DOMContentLoaded', () => {
            let countdown = 2;
            const delayNotice = document.getElementById('delayNotice');

            const countdownInterval = setInterval(() => {
                countdown--;
                if (countdown > 0) {
                    delayNotice.innerText = `Starting in ${countdown}s...`;
                } else {
                    clearInterval(countdownInterval);
                    delayNotice.innerText = "Playing...";
                    playAudio();
                }
            }, 1000);
        });
    </script>
</body>
</html>
